name: DockAnchor candidate UI-only verification
on:
  push:
    branches: ['verification/event-tap-ui-only']
permissions:
  contents: read
jobs:
  ui:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidate/dockanchor-2d1dfee
      - name: Exact revision
        run: |
          test "$(git rev-parse HEAD)" = 2d1dfee186039d02cebaa26a8eb47dadc40b3463
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
      - name: Run UI test target through shared scheme
        run: |
          set -o pipefail
          xcodebuild test \
            -project DockAnchor.xcodeproj \
            -scheme DockAnchor \
            -destination 'platform=macOS' \
            -configuration Debug \
            -only-testing:DockAnchorUITests \
            -resultBundlePath "$RUNNER_TEMP/DockAnchor-UI.xcresult" \
            CODE_SIGN_IDENTITY="-" CODE_SIGNING_REQUIRED=NO \
            2>&1 | tee "$RUNNER_TEMP/DockAnchor-UI.log"
      - if: always()
        run: |
          xcrun xcresulttool get test-results summary --path "$RUNNER_TEMP/DockAnchor-UI.xcresult" > "$RUNNER_TEMP/DockAnchor-UI-summary.json" || true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DockAnchor-candidate-UI-only
          retention-days: 7
          path: |
            ${{ runner.temp }}/DockAnchor-UI.log
            ${{ runner.temp }}/DockAnchor-UI.xcresult
            ${{ runner.temp }}/DockAnchor-UI-summary.json
